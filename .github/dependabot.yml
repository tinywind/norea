version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Phnom_Penh"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    versioning-strategy: "increase"
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      mantine:
        patterns: ["@mantine/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Phnom_Penh"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      tauri-windows:
        patterns: ["tauri*", "webview2-com*", "windows*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "gradle"
    directory: "/src-tauri/gen/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Phnom_Penh"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      android-build-tools:
        patterns: ["com.android.tools.build:gradle", "org.jetbrains.kotlin:*"]
      androidx:
        patterns: ["androidx.*:*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Phnom_Penh"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
