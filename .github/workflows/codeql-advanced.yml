name: CodeQL Advanced

on:
  push:
    branches: ["0.2"]
  pull_request:
    branches: ["0.2"]
  schedule:
    - cron: "23 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    env:
      CI: "true"
      NODE_IMAGE: node:24-bookworm
      PYTHON_IMAGE: python:3.14-slim
      ANDROID_BUILDER_IMAGE: norea-android-builder:local
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
      ANDROID_SDK_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: 36.0.0
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_CMAKE_VERSION: 3.22.1
      NOREA_BUILD_CHANNEL: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare verified CodeQL bundle in Node container
        id: prepare-codeql
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mount_args=(-v "$GITHUB_WORKSPACE:/workspace:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP")
          case "$GITHUB_OUTPUT" in
            "$RUNNER_TEMP"/*) ;;
            *) mount_args+=(-v "$GITHUB_OUTPUT:$GITHUB_OUTPUT") ;;
          esac
          docker run --rm --user "$(id -u):$(id -g)" \
            "${mount_args[@]}" \
            -w /workspace \
            -e CODEQL_LANGUAGE \
            -e GH_TOKEN \
            -e RUNNER_TEMP \
            -e GITHUB_OUTPUT \
            "$NODE_IMAGE" \
            node scripts/prepare-codeql.mjs

      - name: Initialize CodeQL
        if: matrix.language != 'java-kotlin'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          tools: ${{ steps.prepare-codeql.outputs.tools }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analyze the extracted source
        if: matrix.language != 'java-kotlin'
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
          output: .tmp/codeql-results/${{ matrix.language }}
          upload: always

      - name: Set up Docker Buildx
        if: matrix.language == 'java-kotlin'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Android toolchain container image
        if: matrix.language == 'java-kotlin'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/docker
          file: .github/docker/android-builder.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.ANDROID_BUILDER_IMAGE }}
          build-args: |
            ANDROID_SDK_PLATFORM=${{ env.ANDROID_SDK_PLATFORM }}
            ANDROID_BUILD_TOOLS=${{ env.ANDROID_BUILD_TOOLS }}
            ANDROID_NDK_VERSION=${{ env.ANDROID_NDK_VERSION }}
            ANDROID_CMAKE_VERSION=${{ env.ANDROID_CMAKE_VERSION }}
          cache-from: type=gha,scope=norea-android-builder
          cache-to: type=gha,mode=min,scope=norea-android-builder

      - name: Cache pnpm store
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: norea-codeql-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            norea-codeql-pnpm-

      - name: Cache Gradle home
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gradle-home
          key: norea-codeql-gradle-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/gen/android/**/*.gradle.kts') }}
          restore-keys: |
            norea-codeql-gradle-

      - name: Cache Rust Android build artifacts
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-home/git/db
            src-tauri/target
          key: v0-rust-codeql-android-aarch64-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            v0-rust-codeql-android-aarch64-${{ hashFiles('src-tauri/Cargo.lock') }}-
            v0-rust-codeql-android-aarch64-

      - name: Build Android APK, run JVM tests, and analyze Java/Kotlin with CodeQL in container
        if: matrix.language == 'java-kotlin'
        id: java_codeql
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_BUNDLE: ${{ steps.prepare-codeql.outputs.tools }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-home" "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/gradle-home" "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/apk-manifests" "$RUNNER_TEMP/codeql-work"
          docker run --rm -i --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -v "$RUNNER_TEMP/pnpm-store:/pnpm-store" \
            -v "$RUNNER_TEMP/gradle-home:/gradle-home" \
            -v "$RUNNER_TEMP/cargo-home:/cargo-home" \
            -v "$RUNNER_TEMP/apk-manifests:/apk-manifests" \
            -v "$RUNNER_TEMP/codeql-work:/codeql-work" \
            -v "$CODEQL_BUNDLE:/codeql-bundle.tar.zst:ro" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            -e PNPM_STORE_DIR=/pnpm-store \
            -e GRADLE_USER_HOME=/gradle-home \
            -e CARGO_HOME=/cargo-home \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e "GIT_CONFIG_VALUE_0=*" \
            -e GH_TOKEN \
            -e NOREA_BUILD_CHANNEL \
            -e GRADLE_OPTS \
            "$ANDROID_BUILDER_IMAGE" \
            bash -euo pipefail <<'CONTAINER'
          clang_bin="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          sysroot="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          resource_dir="$("$clang_bin" --print-resource-dir)"
          test -f "${resource_dir}/include/stddef.h"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=${sysroot} -resource-dir=${resource_dir}"

          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
          node scripts/prepare-gradle-cache.mjs

          rm -rf /codeql-work/bundle /codeql-work/db
          mkdir -p /codeql-work/bundle /workspace/.tmp/codeql-results/java-kotlin
          tar --zstd -xf /codeql-bundle.tar.zst -C /codeql-work/bundle
          codeql_bin="/codeql-work/bundle/codeql/codeql"
          test -x "$codeql_bin"

          cat <<'BUILD' > /codeql-work/build.sh
          #!/usr/bin/env bash
          set -euo pipefail
          pnpm tauri android build --debug --apk --target aarch64
          cd src-tauri/gen/android
          ./gradlew :app:testUniversalDebugUnitTest --no-daemon
          BUILD
          chmod +x /codeql-work/build.sh

          "$codeql_bin" database create /codeql-work/db \
            --language=java-kotlin \
            --source-root=/workspace \
            --command=/codeql-work/build.sh

          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Nonempty Android APK required" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            rel="${apk#src-tauri/gen/android/app/build/outputs/apk/}"
            manifest_out="/apk-manifests/${rel}.manifest.xml"
            mkdir -p "$(dirname "$manifest_out")"
            "${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > "$manifest_out"
          done

          "$codeql_bin" database analyze /codeql-work/db \
            codeql/java-queries:codeql-suites/java-security-extended.qls \
            --format=sarif-latest \
            --output=/workspace/.tmp/codeql-results/java-kotlin/java.sarif \
            --sarif-category=/language:java-kotlin \
            --threads=0
          CONTAINER
          test -s .tmp/codeql-results/java-kotlin/java.sarif
          echo "sarif-output=.tmp/codeql-results/java-kotlin/java.sarif" >> "$GITHUB_OUTPUT"

      - name: Verify compiled APK manifest and Android JVM regression reports in Python container
        if: matrix.language == 'java-kotlin'
        run: |
          set -euo pipefail
          docker run --rm -i --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/apk-manifests:/apk-manifests:ro" \
            -w /workspace \
            "$PYTHON_IMAGE" \
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET

          apk_root = Path('src-tauri/gen/android/app/build/outputs/apk')
          apks = list(apk_root.rglob('*.apk'))
          assert apks and all(path.stat().st_size > 0 for path in apks), 'Nonempty Android APK required'
          for path in apks:
              with ZipFile(path) as archive:
                  names = archive.namelist()
                  assert 'AndroidManifest.xml' in names and 'classes.dex' in names
                  assert any(name.startswith('lib/arm64-v8a/') and name.endswith('.so') for name in names)
              rel = path.relative_to(apk_root)
              manifest_path = Path('/apk-manifests') / f'{rel}.manifest.xml'
              application = ET.parse(manifest_path).getroot().find('application')
              assert application is not None and application.get('{http://schemas.android.com/apk/res/android}allowBackup') == 'false'
              print('Compiled APK manifest: allowBackup=false')
              print(path, path.stat().st_size)

          reports = list(Path('src-tauri/gen/android/app/build/test-results/testUniversalDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'Android JVM test reports required'
          suites = [ET.parse(path).getroot() for path in reports]
          assert all(int(suite.get('failures', 0)) == int(suite.get('errors', 0)) == 0 for suite in suites)
          tests = sum(int(suite.get('tests', 0)) for suite in suites)
          skipped = sum(int(suite.get('skipped', 0)) for suite in suites)
          assert tests > 0 and skipped == 0, 'Executed, unskipped Android JVM tests required'
          security = [suite for suite in suites if suite.get('name') == 'io.github.tinywind.norea.AndroidLogMessagesTest']
          assert len(security) == 1, 'Android log security regression suite required'
          required_security_cases = {
              'fileAndUriValuesCannotCreateAnotherLogLine',
              'exceptionDetailsStayPresentWithoutUnescapedStackTraceLines',
              'ordinaryPathsAndUnicodeTextRemainUnchanged',
              'credentialsAreRemovedBeforeMessagesReachLocalFiles',
              'oversizedRuntimeMessagesStayWithinTheUtf8Budget',
          }
          executed_security_cases = {case.get('name') for case in security[0].findall('testcase')}
          assert required_security_cases <= executed_security_cases, 'Required Android log security cases did not execute'
          print(f'Android JVM tests: {tests}, executed: {tests - skipped}, skipped: {skipped}, suites: {len(suites)}, failures: 0, errors: 0')
          PY

      - name: Upload Java/Kotlin SARIF results
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: .tmp/codeql-results/java-kotlin/java.sarif
          category: /language:java-kotlin

      - name: Retain CodeQL analysis evidence
        if: always() && (steps.analyze.outputs.sarif-output != '' || steps.java_codeql.outputs.sarif-output != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-verification-${{ matrix.language }}
          path: ${{ steps.java_codeql.outputs.sarif-output || steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 3
