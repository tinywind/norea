name: Windows dependency checks

on:
  pull_request:
    branches: ["0.2"]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/gen/android/**"
  push:
    branches: ["0.2"]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/windows-dependency-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-dependency-check:
    name: Windows dependency check (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            rust-target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            rust-target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - name: Configure OpenVPN native build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cmake = Get-Command cmake -ErrorAction Stop
          & $cmake.Source --version

          $tapHeaderDirectory = Join-Path $env:GITHUB_WORKSPACE ".tmp\openvpn-build\include"
          $tapHeader = Join-Path $tapHeaderDirectory "tap-windows.h"
          $tapHeaderUrl = "https://raw.githubusercontent.com/OpenVPN/tap-windows6/b9762e7db2a2670c05c9931e948b9f21d0a3c763/src/tap-windows.h"
          $expectedTapHeaderHash = "0b9ea5e4b4dc2c2764fde3383440af9a11a1ead3f2a4bbec674be40da384d10e"
          New-Item -ItemType Directory -Force -Path $tapHeaderDirectory | Out-Null
          Invoke-WebRequest -Uri $tapHeaderUrl -OutFile $tapHeader
          $tapHeaderHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tapHeader).Hash.ToLowerInvariant()
          if ($tapHeaderHash -ne $expectedTapHeaderHash) {
            throw "tap-windows.h checksum mismatch: expected $expectedTapHeaderHash, got $tapHeaderHash"
          }

          $libclangPath = Join-Path $env:ProgramFiles "LLVM\bin"
          $libclang = Join-Path $libclangPath "libclang.dll"
          if (-not (Test-Path $libclang -PathType Leaf)) {
            throw "libclang was not found at $libclang"
          }

          $clang = Join-Path $libclangPath "clang++.exe"
          if (-not (Test-Path $clang -PathType Leaf)) {
            throw "Clang C++ was not found at $clang"
          }
          & $clang --version

          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV
          "CL=/I`"$tapHeaderDirectory`"" >> $env:GITHUB_ENV

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows app without publishing
        run: pnpm tauri build --target ${{ matrix.rust-target }} --no-bundle

      - name: Run Rust unit tests on Windows x64
        if: matrix.platform == 'windows-x64'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDirectory = Join-Path $env:GITHUB_WORKSPACE ".tmp\windows-rust-tests"
          New-Item -ItemType Directory -Force -Path $testDirectory | Out-Null
          $artifacts = Join-Path $testDirectory "artifacts.jsonl"
          cargo test --lib --locked --target ${{ matrix.rust-target }} --no-run --message-format=json-render-diagnostics > $artifacts
          if ($LASTEXITCODE -ne 0) { throw "Rust unit-test compilation failed" }
          $testExecutables = @(Get-Content $artifacts | Where-Object { $_.TrimStart().StartsWith("{") } | ForEach-Object { ConvertFrom-Json $_ } |
            Where-Object { $_.reason -eq "compiler-artifact" -and $_.target.name -eq "app_lib" -and $_.profile.test -and $_.executable } |
            ForEach-Object { $_.executable })
          if ($testExecutables.Count -ne 1) { throw "Expected one Rust unit-test executable" }
          $testExecutable = $testExecutables[0]
          if (-not (Test-Path $testExecutable -PathType Leaf)) { throw "Rust unit-test executable was not found" }

          # Tauri embeds Common Controls v6 in the app binary, but not the library test binary.
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $manifestTool = Get-ChildItem "$sdkBin\*\x64\mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $manifestTool) { throw "Windows SDK manifest tool was not found" }
          $commonControlsManifest = Join-Path $testDirectory "common-controls.manifest"
          @'
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency><dependentAssembly>
              <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/>
            </dependentAssembly></dependency>
          </assembly>
          '@ | Set-Content -Encoding utf8 $commonControlsManifest
          $originalManifest = Join-Path $testDirectory "original.manifest"
          & $manifestTool.FullName "-inputresource:$testExecutable;#1" "-out:$originalManifest"
          if ($LASTEXITCODE -eq 0) {
            Get-Content $originalManifest
            & $manifestTool.FullName -manifest $originalManifest $commonControlsManifest "-outputresource:$testExecutable;#1"
          } else {
            Write-Host "Manifest extraction exited $LASTEXITCODE; embedding the Common Controls manifest"
            & $manifestTool.FullName -manifest $commonControlsManifest "-outputresource:$testExecutable;#1"
          }
          if ($LASTEXITCODE -ne 0) { throw "Embedding the unit-test manifest failed" }
          cargo test --lib --locked --target ${{ matrix.rust-target }}
          if ($LASTEXITCODE -ne 0) { throw "Rust unit tests failed" }
