# CI for Norea.
#
# Fast quality gate for TypeScript and unit tests, including the registered migration/schema contract.
# Release artifact workflows perform the platform-specific Tauri builds.

name: CI

on:
  push:
    branches: ["0.2"]
  pull_request:
    branches: ["0.2"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc

      - name: Unit and registered migration/schema contract tests
        run: pnpm test

      - name: Build tool preparation tests
        run: node --test scripts/*.node-test.mjs
