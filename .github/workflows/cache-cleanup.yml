name: Actions Cache Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CACHE_MAX_TOTAL_BYTES: "8589934592"
  RUST_CACHE_KEY_PREFIX: "v0-rust-"
  RUST_CACHE_MAX_AGE_DAYS: "3"
  NODE_IMAGE: node:24-bookworm

jobs:
  cleanup:
    name: Prune stale Rust caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete old Rust caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            -e GH_TOKEN \
            -e REPOSITORY \
            -e CACHE_MAX_TOTAL_BYTES \
            -e RUST_CACHE_KEY_PREFIX \
            -e RUST_CACHE_MAX_AGE_DAYS \
            "$NODE_IMAGE" \
            node --input-type=module <<'NODE'
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const maxTotalBytes = Number(process.env.CACHE_MAX_TOTAL_BYTES);
          const prefix = process.env.RUST_CACHE_KEY_PREFIX;
          const maxAgeDays = Number(process.env.RUST_CACHE_MAX_AGE_DAYS);
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'User-Agent': 'norea-cache-cleanup',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          const listResponse = await fetch(
            `https://api.github.com/repos/${repository}/actions/caches?per_page=100&sort=last_accessed_at&direction=asc`,
            { headers },
          );
          if (!listResponse.ok) {
            throw new Error(`Failed to list Actions caches: HTTP ${listResponse.status} ${await listResponse.text()}`);
          }
          const payload = await listResponse.json();
          const caches = Array.isArray(payload.actions_caches) ? payload.actions_caches : [];

          let totalBytes = caches.reduce((sum, item) => sum + Number(item.size_in_bytes ?? 0), 0);
          const cutoffMs = Date.now() - maxAgeDays * 24 * 60 * 60 * 1000;
          const rustCaches = caches.filter(item => typeof item.key === 'string' && item.key.startsWith(prefix));
          const toDelete = new Map();

          for (const item of rustCaches) {
            const accessedMs = Date.parse(item.last_accessed_at);
            if (Number.isFinite(accessedMs) && accessedMs < cutoffMs) {
              toDelete.set(item.id, item);
              totalBytes -= Number(item.size_in_bytes ?? 0);
            }
          }

          if (totalBytes > maxTotalBytes) {
            for (const item of rustCaches) {
              if (toDelete.has(item.id)) continue;
              if (totalBytes <= maxTotalBytes) break;
              toDelete.set(item.id, item);
              totalBytes -= Number(item.size_in_bytes ?? 0);
            }
          }

          if (toDelete.size === 0) {
            console.log('No Rust caches need pruning.');
            process.exit(0);
          }

          for (const item of toDelete.values()) {
            console.log(`Deleting Rust cache ${item.id} (${item.key}, ${item.size_in_bytes} bytes, last accessed ${item.last_accessed_at})`);
            const delResponse = await fetch(
              `https://api.github.com/repos/${repository}/actions/caches/${item.id}`,
              { method: 'DELETE', headers },
            );
            if (!delResponse.ok && delResponse.status !== 404) {
              throw new Error(`Failed to delete cache ${item.id}: HTTP ${delResponse.status} ${await delResponse.text()}`);
            }
          }
          NODE
