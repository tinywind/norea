name: Android Release APKs

on:
  workflow_dispatch:
  push:
    branches: ["0.2"]
    tags:
      - "v*"
    paths:
      - ".github/workflows/android.yml"
      - ".github/docker/android-builder.Dockerfile"
      - "scripts/prepare-gradle-cache.mjs"
      - "scripts/upload-github-release-assets.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "src-tauri/**"
      - "drizzle/**"
      - "public/**"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_IMAGE: node:24-bookworm
  ANDROID_BUILDER_IMAGE: norea-android-builder:local
  ANDROID_SDK_PLATFORM: android-36
  ANDROID_NATIVE_PLATFORM: android-24
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_CMAKE_VERSION: 3.22.1
  DEV_RELEASE_TAG: dev-0.2
  RELEASE_SIGNED_APK_DIR: .tmp/android-release-apks

jobs:
  android-release-apks:
    name: Android release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Android toolchain container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/docker
          file: .github/docker/android-builder.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.ANDROID_BUILDER_IMAGE }}
          build-args: |
            ANDROID_SDK_PLATFORM=${{ env.ANDROID_SDK_PLATFORM }}
            ANDROID_BUILD_TOOLS=${{ env.ANDROID_BUILD_TOOLS }}
            ANDROID_NDK_VERSION=${{ env.ANDROID_NDK_VERSION }}
            ANDROID_CMAKE_VERSION=${{ env.ANDROID_CMAKE_VERSION }}
          cache-from: type=gha,scope=norea-android-builder
          cache-to: type=gha,mode=min,scope=norea-android-builder

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: norea-android-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            norea-android-pnpm-

      - name: Cache Gradle home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gradle-home
          key: norea-android-gradle-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/gen/android/**/*.gradle.kts') }}
          restore-keys: |
            norea-android-gradle-

      - name: Cache Rust Android build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
            ${{ runner.temp }}/cargo-home/git/db
            src-tauri/target
          key: v0-rust-android-release-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            v0-rust-android-release-${{ hashFiles('src-tauri/Cargo.lock') }}-
            v0-rust-android-release-

      - name: Build, sign, verify, and package Android release APKs in container
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-home" "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/gradle-home" "$RUNNER_TEMP/cargo-home"

          build_channel="dev"
          build_version=""
          update_channel="dev"
          if [ "$REF_TYPE" = "tag" ]; then
            build_channel="release"
            update_channel="stable"
            build_version="${REF_NAME#v}"
          fi
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Dev release APKs are built with tracing enabled (debuggable for run-as and
          # inspectable WebViews) and published under the standard APK names.
          docker run --rm -i --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -v "$RUNNER_TEMP/pnpm-store:/pnpm-store" \
            -v "$RUNNER_TEMP/gradle-home:/gradle-home" \
            -v "$RUNNER_TEMP/cargo-home:/cargo-home" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            -e PNPM_STORE_DIR=/pnpm-store \
            -e GRADLE_USER_HOME=/gradle-home \
            -e CARGO_HOME=/cargo-home \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e "GIT_CONFIG_VALUE_0=*" \
            -e GH_TOKEN \
            -e ANDROID_PLATFORM="$ANDROID_NATIVE_PLATFORM" \
            -e NOREA_TRACING_BUILD="true" \
            -e NOREA_BUILD_CHANNEL="$build_channel" \
            -e NOREA_BUILD_VERSION="$build_version" \
            -e NOREA_BUILD_TIME="$build_time" \
            -e NOREA_GIT_SHA="$GITHUB_SHA" \
            -e NOREA_GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e NOREA_GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e UPDATE_CHANNEL="$update_channel" \
            -e UPDATE_VERSION="$build_version" \
            -e UPDATE_WORKFLOW="android.yml" \
            -e UPDATE_RUN_ID="$GITHUB_RUN_ID" \
            -e UPDATE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            -e UPDATE_HEAD_SHA="$GITHUB_SHA" \
            -e RELEASE_SIGNED_APK_DIR \
            -e ANDROID_BUILD_TOOLS \
            -e ANDROID_RELEASE_KEYSTORE_BASE64 \
            -e ANDROID_RELEASE_KEY_ALIAS \
            -e ANDROID_RELEASE_STORE_PASSWORD \
            -e ANDROID_RELEASE_KEY_PASSWORD \
            "$ANDROID_BUILDER_IMAGE" \
            bash -euo pipefail <<'CONTAINER'
          clang_bin="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          sysroot="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          resource_dir="$("$clang_bin" --print-resource-dir)"
          test -f "${resource_dir}/include/stddef.h"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android24 --sysroot=${sysroot} -resource-dir=${resource_dir}"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android24 --sysroot=${sysroot} -resource-dir=${resource_dir}"

          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init --ci --skip-targets-install
          fi

          node scripts/prepare-gradle-cache.mjs

          signing_dir=".tmp/android-release-signing"
          mkdir -p "$signing_dir"
          if [ -n "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ] &&
             [ -n "${ANDROID_RELEASE_KEY_ALIAS:-}" ] &&
             [ -n "${ANDROID_RELEASE_STORE_PASSWORD:-}" ] &&
             [ -n "${ANDROID_RELEASE_KEY_PASSWORD:-}" ]; then
            keystore="$(pwd)/$signing_dir/release.jks"
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            export ANDROID_RELEASE_KEYSTORE_FILE="$keystore"
          else
            keystore="$(pwd)/$signing_dir/test-release.jks"
            rm -f "$keystore"
            keytool -genkeypair \
              -keystore "$keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Norea Test Release,O=Norea,C=US"
            export ANDROID_RELEASE_KEYSTORE_FILE="$keystore"
            export ANDROID_RELEASE_KEY_ALIAS="androiddebugkey"
            export ANDROID_RELEASE_STORE_PASSWORD="android"
            export ANDROID_RELEASE_KEY_PASSWORD="android"
            echo "::warning::Android release signing secrets are not configured; generated a public test release key."
          fi

          pnpm android:apk:release

          release_apk_root="src-tauri/gen/android/app/build/outputs/apk"
          mkdir -p "$RELEASE_SIGNED_APK_DIR"

          apksigner="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          checksum_file="$RELEASE_SIGNED_APK_DIR/SHA256SUMS.txt"
          : > "$checksum_file"

          for release_apk in \
            "$release_apk_root/arm64/release/app-arm64-release.apk" \
            "$release_apk_root/x86_64/release/app-x86_64-release.apk"; do
            if [ ! -f "$release_apk" ]; then
              echo "Expected release APK not found: $release_apk"
              exit 1
            fi

            variant="$(basename "$(dirname "$(dirname "$release_apk")")")"
            collected_apk="$RELEASE_SIGNED_APK_DIR/norea-${variant}.apk"

            "$apksigner" verify --verbose "$release_apk"
            cp "$release_apk" "$collected_apk"
            (cd "$RELEASE_SIGNED_APK_DIR" && sha256sum "$(basename "$collected_apk")") >> "$checksum_file"
          done

          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";

          const artifactDir = process.env.RELEASE_SIGNED_APK_DIR;
          const channel = process.env.UPDATE_CHANNEL;
          const version = process.env.UPDATE_VERSION || null;
          const pairs = [
            ["android-arm64", "norea-arm64.apk"],
            ["android-x86_64", "norea-x86_64.apk"],
          ];

          for (const [platform, name] of pairs) {
            const filePath = path.join(artifactDir, name);
            const bytes = fs.readFileSync(filePath);
            const manifest = {
              schemaVersion: 1,
              channel,
              platform,
              version,
              generatedAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              assets: [
                {
                  name,
                  artifactName: name,
                  platform,
                  size: bytes.length,
                  sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
                  signature: null,
                  signingKeyId: null,
                },
              ],
              signature: null,
              signingKeyId: null,
              dev: channel === "dev" ? {
                workflow: process.env.UPDATE_WORKFLOW,
                runId: process.env.UPDATE_RUN_ID,
                runAttempt: process.env.UPDATE_RUN_ATTEMPT,
                headSha: process.env.UPDATE_HEAD_SHA,
                artifactName: null,
              } : null,
            };
            fs.writeFileSync(
              path.join(artifactDir, `norea-updates-${platform}.json`),
              `${JSON.stringify(manifest, null, 2)}\n`,
            );
          }
          NODE
          CONTAINER

      - name: Upload arm64 signed release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: norea-arm64.apk
          path: ${{ env.RELEASE_SIGNED_APK_DIR }}/norea-arm64.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload x86_64 signed release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: norea-x86_64.apk
          path: ${{ env.RELEASE_SIGNED_APK_DIR }}/norea-x86_64.apk
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload signed release APK checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: norea-android-checksums
          path: ${{ env.RELEASE_SIGNED_APK_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload arm64 Android update metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: norea-updates-android-arm64.json
          path: ${{ env.RELEASE_SIGNED_APK_DIR }}/norea-updates-android-arm64.json
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload x86_64 Android update metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: norea-updates-android-x86_64.json
          path: ${{ env.RELEASE_SIGNED_APK_DIR }}/norea-updates-android-x86_64.json
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30

      - name: Upload signed APKs to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSETS_DIR: ${{ env.RELEASE_SIGNED_APK_DIR }}
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY \
            -e RELEASE_TAG \
            -e RELEASE_ASSETS_DIR \
            "$NODE_IMAGE" \
            node scripts/upload-github-release-assets.mjs

      - name: Upload signed APKs to dev release
        if: github.ref_type != 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.DEV_RELEASE_TAG }}
          RELEASE_ASSETS_DIR: ${{ env.RELEASE_SIGNED_APK_DIR }}
          CREATE_PRERELEASE: "true"
          RELEASE_TITLE: "Latest 0.2 dev build"
          RELEASE_NOTES: "Latest successful 0.2 development build assets."
          RELEASE_TARGET_COMMITISH: ${{ github.sha }}
          PRUNE_LEGACY_ANDROID_DEV_ASSETS: "true"
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY \
            -e RELEASE_TAG \
            -e RELEASE_ASSETS_DIR \
            -e CREATE_PRERELEASE \
            -e RELEASE_TITLE \
            -e RELEASE_NOTES \
            -e RELEASE_TARGET_COMMITISH \
            -e PRUNE_LEGACY_ANDROID_DEV_ASSETS \
            "$NODE_IMAGE" \
            node scripts/upload-github-release-assets.mjs
