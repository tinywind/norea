name: Y700 ARM64 fix candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: y700-fix-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_SDK_PLATFORM: android-36
  ANDROID_NATIVE_PLATFORM: android-24
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  y700-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri

      - name: Install Android SDK packages
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;${ANDROID_SDK_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure native build tools
        run: |
          set -euo pipefail
          toolchain="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          cmake="${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"
          test -x "$cmake"
          resource_dir="$($toolchain/bin/clang --print-resource-dir)"
          test -f "$resource_dir/include/stddef.h"
          test -f "$toolchain/lib/libclang.so"
          echo "CMAKE=$cmake" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$toolchain/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android24 --sysroot=$toolchain/sysroot -resource-dir=$resource_dir" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Require existing release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          mkdir -p .tmp/y700-ci-signing
          keystore="$(pwd)/.tmp/y700-ci-signing/release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Stamp candidate identity
        run: |
          echo "NOREA_BUILD_CHANNEL=dev" >> "$GITHUB_ENV"
          echo "NOREA_GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "NOREA_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "NOREA_GITHUB_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "NOREA_GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Build only the Y700 ABI
        env:
          ANDROID_PLATFORM: ${{ env.ANDROID_NATIVE_PLATFORM }}
        run: pnpm exec tauri android build --apk --target aarch64

      - name: Verify and collect signed APK
        run: |
          set -euo pipefail
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          test -f "$apk"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$apk"
          mkdir -p .tmp/y700-ci
          cp "$apk" .tmp/y700-ci/norea-arm64.apk
          cd .tmp/y700-ci
          sha256sum norea-arm64.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: norea-y700-arm64
          path: |
            .tmp/y700-ci/norea-arm64.apk
            .tmp/y700-ci/SHA256SUMS.txt
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing input
        if: always()
        run: rm -f .tmp/y700-ci-signing/release.jks
